<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication — Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="communication.css">
</head>
<body>

<div id="codeScreen" class="identity-screen">
  <h2>Code d'accès</h2>
  <input type="tel" id="codeInput" class="code-input" maxlength="4" placeholder="••••" inputmode="numeric">
  <button class="identity-btn" id="codeSubmit">Valider</button>
  <div class="code-error hidden" id="codeError">Code incorrect</div>
</div>

<div id="identityScreen" class="identity-screen hidden">
  <h2>Tu es qui ?</h2>
  <button class="identity-btn" data-id="julien">Julien</button>
  <button class="identity-btn" data-id="freddy">Freddy</button>
</div>

<div id="mainApp" class="main-app hidden">
  <div class="status" id="status">Connexion...</div>
  <button class="switch-user" id="switchUser">Changer</button>
  <a href="sono.html" class="send-btn sono-link hidden" id="sonoLink">🎛️ Réglages sono</a>

  <div class="historique-wrap hidden" id="historiqueWrap">
    <div class="historique" id="historique"></div>
  </div>

  <div class="columns">
    <section class="col-envoi">
      <h1>Envoi</h1>

      <div class="btn-grid">
        <button class="action-btn yellow" data-val="prepare">Prépare-toi</button>
        <button class="action-btn green" data-val="go">GO</button>
        <button class="action-btn red" data-val="stop">STOP</button>
        <button class="action-btn red" data-val="pasPret">Pas Prêt</button>
        <button class="action-btn vu" id="vuBtn" data-val="vu">VU</button>
        <button class="action-btn green" data-val="pret">Prêt</button>
      </div>

      <textarea id="messageInput" placeholder="Zone de texte..."></textarea>
      <button class="send-btn" id="sendBtn">Envoyer</button>
    </section>

    <div class="divider"></div>

    <section class="col-recu">
      <h1>Reçu</h1>

      <div class="btn-grid" id="recuGrid">
        <div class="indicator yellow" data-val="prepare">Prépare-toi</div>
        <div class="indicator green" data-val="go">GO</div>
        <div class="indicator red" data-val="stop">STOP</div>
        <div class="indicator red" data-val="pasPret">Pas Prêt</div>
        <div></div>
        <div class="indicator green" data-val="pret">Prêt</div>
      </div>

      <div class="received-box" id="receivedText">Texte reçu</div>

      <div class="etat-history-wrap">
        <div class="history-title">Historique des états reçus</div>
        <div class="etat-history" id="etatHistory">
          <div class="history-empty" id="historyEmpty">Aucun état reçu</div>
        </div>
      </div>
    </section>
  </div>

</div>

<script type="module">
  const CODE_ACCES = "0402";
  const codeScreen = document.getElementById("codeScreen");
  const identityScreen = document.getElementById("identityScreen");
  const mainApp = document.getElementById("mainApp");
  const statusEl = document.getElementById("status");
  const IDENTITES = { julien: "freddy", freddy: "julien" };

  function getMoi() { return localStorage.getItem("moi"); }
  function codeValide() { return localStorage.getItem("codeOk") === "1"; }

  function afficherApp() {
    codeScreen.classList.add("hidden");
    identityScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    demarrerFirebase();
  }

  function afficherIdentite() {
    codeScreen.classList.add("hidden");
    identityScreen.classList.remove("hidden");
  }

  document.getElementById("codeSubmit").addEventListener("click", validerCode);
  document.getElementById("codeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") validerCode();
  });

  function validerCode() {
    const saisi = document.getElementById("codeInput").value.trim();
    if (saisi === CODE_ACCES) {
      localStorage.setItem("codeOk", "1");
      if (getMoi()) afficherApp(); else afficherIdentite();
    } else {
      document.getElementById("codeError").classList.remove("hidden");
    }
  }

  document.querySelectorAll(".identity-btn[data-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      localStorage.setItem("moi", btn.dataset.id);
      afficherApp();
    });
  });

  document.getElementById("switchUser").addEventListener("click", () => {
    localStorage.removeItem("moi");
    location.reload();
  });

  if (codeValide()) {
    if (getMoi()) afficherApp(); else afficherIdentite();
  }

  async function demarrerFirebase() {
    const moi = getMoi();
    const autre = IDENTITES[moi];
    let firebaseConfig, initializeApp, getDatabase, ref, set, push, remove, onValue, onChildAdded, query, orderByChild, limitToLast;

    try {
      const mod = await import("./firebase-config.js");
      firebaseConfig = mod.firebaseConfig;
      ({ initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"));
      ({ getDatabase, ref, set, push, remove, onValue, onChildAdded, query, orderByChild, limitToLast } =
        await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"));
    } catch (e) {
      statusEl.textContent = "Erreur de chargement : " + e.message;
      statusEl.style.color = "#ff6b6b";
      throw e;
    }

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      statusEl.textContent = "Erreur config Firebase : " + e.message;
      statusEl.style.color = "#ff6b6b";
      throw e;
    }

    // Vibration : fonctionne surtout sur Android / navigateurs compatibles.
    // Elle est volontairement silencieuse si le navigateur ne la supporte pas.
    function vibrer(pattern = [180]) {
      try {
        if (typeof navigator.vibrate === "function") navigator.vibrate(pattern);
      } catch (e) { /* vibration non disponible */ }
    }

    function viderRecus() {
      document.querySelectorAll("#recuGrid .indicator").forEach(el => {
        el.classList.remove("active");
      });
      document.getElementById("receivedText").textContent = "Texte reçu";
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      if (snap.val() === true) {
        statusEl.textContent = "✓ Connecté (" + moi + ")";
        statusEl.classList.add("connected");
      } else {
        statusEl.textContent = "Connexion...";
        statusEl.classList.remove("connected");
      }
    });

    if (moi === "freddy") document.getElementById("sonoLink").classList.remove("hidden");

    if (moi === "julien") document.getElementById("historiqueWrap").classList.remove("hidden");

    // Historique des commandes sono existant.
    let commandeInitiale = true;
    let dernierTimestamp = null;
    onValue(ref(db, "participants/" + autre + "/commande"), (snap) => {
      const val = snap.val();
      if (!val) return;
      if (commandeInitiale) {
        commandeInitiale = false;
        dernierTimestamp = val.timestamp;
        return;
      }
      if (val.timestamp !== dernierTimestamp) {
        dernierTimestamp = val.timestamp;
        ajouterHistorique(val.valeur);
        jouerSon();
        vibrer([120, 80, 120]);
      }
    });

    function ajouterHistorique(texte) {
      const historique = document.getElementById("historique");
      historique.querySelectorAll(".historique-item").forEach(it => it.classList.remove("latest"));
      const item = document.createElement("div");
      item.className = "historique-item latest";
      item.textContent = texte;
      historique.insertBefore(item, historique.firstChild);
      const tous = historique.querySelectorAll(".historique-item");
      if (tous.length > 8) historique.removeChild(tous[tous.length - 1]);
    }

    function jouerSon() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) { /* audio non disponible */ }
    }

    // Envoi : boutons d'état. VU est un accusé de lecture, pas un état normal.
    document.querySelectorAll(".action-btn[data-val]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const valeur = btn.dataset.val;

        if (valeur === "vu") {
          const timestamp = Date.now();

          // On envoie l'accusé de lecture à l'autre profil.
          // L'autre profil supprimera alors son état/message dans Firebase,
          // ce qui efface réellement l'information sur les deux écrans.
          await set(ref(db, "participants/" + moi + "/vu"), { timestamp });

          // Effacement immédiat côté téléphone qui vient d'appuyer sur VU.
          viderRecus();
          return;
        }

        const timestamp = Date.now();
        await set(ref(db, "participants/" + moi + "/etat"), {
          valeur,
          timestamp
        });

        // Chaque appui est conservé dans l'historique côté Firebase.
        await set(push(ref(db, "participants/" + moi + "/etatHistory")), {
          valeur,
          timestamp
        });

        document.querySelectorAll(".col-envoi .action-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // Envoi : message texte.
    document.getElementById("sendBtn").addEventListener("click", async () => {
      const input = document.getElementById("messageInput");
      const texte = input.value.trim();
      if (!texte) return;
      await set(ref(db, "participants/" + moi + "/message"), {
        valeur: texte,
        timestamp: Date.now()
      });
      input.value = "";
    });

    // Reçu : état de l'autre. Pas de vibration au chargement initial.
    let etatInitial = true;
    let dernierEtatTimestamp = null;
    onValue(ref(db, "participants/" + autre + "/etat"), (snap) => {
      const data = snap.val();
      if (!data) return;

      document.querySelectorAll("#recuGrid .indicator").forEach(el => {
        el.classList.toggle("active", el.dataset.val === data.valeur);
      });

      if (etatInitial) {
        etatInitial = false;
        dernierEtatTimestamp = data.timestamp;
        return;
      }

      if (data.timestamp !== dernierEtatTimestamp) {
        dernierEtatTimestamp = data.timestamp;
        vibrer([180, 80, 180]);
        jouerSon();
      }
    });

    // Reçu : message de l'autre. Pas de vibration au chargement initial.
    let messageInitial = true;
    let dernierMessageTimestamp = null;
    onValue(ref(db, "participants/" + autre + "/message"), (snap) => {
      const data = snap.val();
      if (!data) return;
      document.getElementById("receivedText").textContent = data.valeur || "Texte reçu";

      if (messageInitial) {
        messageInitial = false;
        dernierMessageTimestamp = data.timestamp;
        return;
      }

      if (data.timestamp !== dernierMessageTimestamp) {
        dernierMessageTimestamp = data.timestamp;
        vibrer([300, 100, 300]);
        jouerSon();
      }
    });

    // Historique de TOUS les états reçus, conservé dans Firebase.
    const historyQuery = query(
      ref(db, "participants/" + autre + "/etatHistory"),
      orderByChild("timestamp"),
      limitToLast(12)
    );

    onChildAdded(historyQuery, (snap) => {
      const data = snap.val();
      if (!data || !data.valeur) return;
      ajouterHistoriqueEtat(data.valeur, data.timestamp);
    });

    function ajouterHistoriqueEtat(valeur, timestamp) {
      const history = document.getElementById("etatHistory");
      const empty = document.getElementById("historyEmpty");
      if (empty) empty.remove();

      const item = document.createElement("div");
      item.className = "etat-history-item";
      item.textContent = valeur === "prepare" ? "PRÉPARE-TOI" :
                         valeur === "pasPret" ? "PAS PRÊT" :
                         valeur.toUpperCase();
      if (timestamp) {
        const heure = new Date(timestamp).toLocaleTimeString("fr-FR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
        item.title = heure;
      }
      history.appendChild(item);

      while (history.children.length > 12) history.removeChild(history.firstElementChild);
      history.scrollTop = history.scrollHeight;
    }

    // Quand l'autre personne appuie sur VU, on efface l'information
    // directement dans Firebase. Cela la retire donc des DEUX profils.
    let vuInitial = true;
    let dernierVuTimestamp = null;
    onValue(ref(db, "participants/" + autre + "/vu"), async (snap) => {
      const data = snap.val();
      if (!data) return;

      if (vuInitial) {
        vuInitial = false;
        dernierVuTimestamp = data.timestamp;
        return;
      }

      if (data.timestamp !== dernierVuTimestamp) {
        dernierVuTimestamp = data.timestamp;

        // Le VU confirme l'état reçu : on supprime uniquement l'état
        // chez l'expéditeur. Le message texte reste inchangé.
        // Cela permet d'avoir :
        // - voyant effacé uniquement sur le téléphone qui a appuyé sur VU ;
        // - bouton d'état effacé uniquement sur le téléphone de l'expéditeur.
        await remove(ref(db, "participants/" + moi + "/etat"));

        // Nettoyage du bouton actif sur le profil qui avait envoyé l'état.
        document.querySelectorAll(".col-envoi .action-btn:not(.vu)").forEach(b => {
          b.classList.remove("active");
        });

        // Nettoyage du voyant sur le profil qui a appuyé sur VU.
        viderRecus();
      }
    });

    // Rétablir l'état actif de mes propres boutons si je recharge la page.
    onValue(ref(db, "participants/" + moi + "/etat/valeur"), (snap) => {
      const val = snap.val();
      if (!val) return;
      document.querySelectorAll(".col-envoi .action-btn:not(.vu)").forEach(b => {
        b.classList.toggle("active", b.dataset.val === val);
      });
    });
  }
</script>
</body>
</html>
