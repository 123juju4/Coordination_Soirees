<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réglages sono — Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="communication, sono.css">
</head>
<body>

<div id="mainApp" class="main-app">
  <div class="status" id="status">Connexion...</div>
  <a href="communication.html" class="send-btn sono-link">⬅ Retour</a>

  <h1>Réglages sono</h1>
  <div class="btn-grid">
    <button class="action-btn green" data-val="Volume +">Volume +</button>
    <button class="action-btn red" data-val="Volume -">Volume -</button>
    <div></div>
    <button class="action-btn green" data-val="Reverbe +">Reverbe +</button>
    <button class="action-btn red" data-val="Reverbe -">Reverbe -</button>
    <div></div>
  </div>
</div>

<script type="module">
  const statusEl = document.getElementById("status");
  const moi = localStorage.getItem("moi");
  const codeOk = localStorage.getItem("codeOk") === "1";

  // Cette page n'est utile qu'à Freddy — redirection sinon
  if (!codeOk || moi !== "freddy") {
    location.href = "communication.html";
  }

  let firebaseConfig, initializeApp, getDatabase, ref, set, onValue;
  try {
    const mod = await import("./firebase-config.js");
    firebaseConfig = mod.firebaseConfig;
    ({ initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"));
    ({ getDatabase, ref, set, onValue } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"));
  } catch (e) {
    statusEl.textContent = "Erreur de chargement : " + e.message;
    statusEl.style.color = "#ff6b6b";
    throw e;
  }

  let app, db;
  try {
    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
  } catch (e) {
    statusEl.textContent = "Erreur config Firebase : " + e.message;
    statusEl.style.color = "#ff6b6b";
    throw e;
  }

  onValue(ref(db, ".info/connected"), (snap) => {
    if (snap.val() === true) {
      statusEl.textContent = "✓ Connecté (freddy)";
      statusEl.classList.add("connected");
    } else {
      statusEl.textContent = "Connexion...";
      statusEl.classList.remove("connected");
    }
  });

  document.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      set(ref(db, "participants/freddy/commande"), {
        valeur: btn.dataset.val,
        timestamp: Date.now()
      });
      btn.classList.add("active");
      setTimeout(() => btn.classList.remove("active"), 400);
    });
  });
</script>

</body>
</html>
